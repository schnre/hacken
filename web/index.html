<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com http://localhost:* ws://localhost:*; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Hacken – das Schweizer Kartenspiel mit Jasskarten, gegen den Computer oder online mit Freunden.">
  <meta name="theme-color" content="#123d29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hacken">
  <title>Hacken</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="brand" href="./" aria-label="Hacken">
        <img src="icon.svg" alt="" width="34" height="34">
        <span>Hacken</span>
      </a>
      <ol id="steps" class="steps" aria-label="Spielphase"></ol>
      <span id="code-chip" class="code-chip" hidden></span>
      <nav class="bar-actions">
        <button class="icon-btn" data-action="log" aria-label="Verlauf" title="Verlauf">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 7v5l3 2M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" data-action="rules" aria-label="Spielregeln" title="Spielregeln">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h6M8 11h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" data-action="settings" aria-label="Einstellungen" title="Einstellungen">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="18" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </nav>
    </header>

    <main id="menu" class="menu"></main>

    <main id="table" class="table" hidden>
      <section id="opponents" class="opponents" aria-label="Gegner"></section>
      <section id="center" class="center" aria-label="Tisch"></section>
      <section class="dock" aria-label="Deine Karten">
        <div id="me" class="me"></div>
        <p id="msg" class="msg" aria-live="polite"></p>
        <div id="hand" class="hand"></div>
        <div id="actions" class="actions"></div>
      </section>
    </main>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <noscript>Dieses Spiel benötigt JavaScript.</noscript>
</body>
</html>
